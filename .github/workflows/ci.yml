# The same four steps you can run locally (see README "Development").
# The Dart SDK is pinned: the formatter and the analyzer ship with the SDK,
# so a newer SDK can judge the same code differently.
# test/ci_workflow_test.dart checks this file; update both together.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: "3.8.1"
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      # Tests tagged `integration` are skipped by dart_test.yaml (no network).
      - run: dart test
