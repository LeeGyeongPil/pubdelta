name: pubdelta
description: Slice the CHANGELOG entries between your locked version and the upgrade target, ranked by breaking-change signals. CLI and MCP server for Dart and Flutter.
version: 0.1.0
repository: https://github.com/LeeGyeongPil/pubdelta
issue_tracker: https://github.com/LeeGyeongPil/pubdelta/issues
topics:
  - dependencies
  - changelog
  - cli
  - mcp
  - flutter

environment:
  sdk: ^3.7.0

executables:
  pubdelta:

dependencies:
  archive: ^4.6.0
  args: ^2.5.0
  pub_semver: ^2.1.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
